<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sadeq Odeh — full-stack developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#13141c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c0caf5" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="term"><rect x="660" y="44" width="480" height="232" rx="12"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }

      .fade { opacity: 0; animation: fade .7s ease forwards; }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; }
      .d3 { animation-delay: .5s; } .d4 { animation-delay: .7s; }
      .o1 { animation-delay: 1.4s; } .o2 { animation-delay: 3.1s; }
      @keyframes fade { to { opacity: 1; } }

      #c1 { animation: t1 .6s steps(6, end) .6s forwards; }
      #c2 { animation: t2 1.1s steps(13, end) 1.9s forwards; }
      @keyframes t1 { to { transform: translateX(66px); } }
      @keyframes t2 { to { transform: translateX(143px); } }

      .cursor { opacity: 0; animation: blink 1s steps(1, end) 3.6s infinite; }
      @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .fade, .cursor { animation: none; opacity: 1; }
        .cover { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="900" cy="160" r="300" fill="url(#glow)"/>
  </g>

  <!-- left: intro -->
  <text x="60" y="104" class="mono fade d1" font-size="14" letter-spacing="4" fill="#7dcfff">HELLO, I'M</text>
  <text x="56" y="170" class="sans fade d2" font-size="66" font-weight="700" fill="url(#accent)">Sadeq Odeh</text>
  <text x="60" y="210" class="sans fade d3" font-size="22" fill="#a9b1d6">Full-stack developer · systems tinkerer</text>
  <text x="60" y="248" class="mono fade d4" font-size="14" fill="#565f89">Amman, Jordan  ·  CS @ Al Hussein Technical University</text>
  <rect x="60" y="270" width="56" height="4" rx="2" fill="url(#accent)" class="fade d4"/>

  <!-- right: terminal -->
  <g clip-path="url(#term)">
    <rect x="660" y="44" width="480" height="232" fill="#16161e"/>
    <rect x="660" y="44" width="480" height="36" fill="#1f2335"/>
    <circle cx="684" cy="62" r="6" fill="#f7768e"/>
    <circle cx="704" cy="62" r="6" fill="#e0af68"/>
    <circle cx="724" cy="62" r="6" fill="#9ece6a"/>
    <text x="900" y="67" text-anchor="middle" class="mono" font-size="13" fill="#565f89">sardeq@github: ~</text>

    <g class="mono" font-size="17">
      <text x="684" y="116" fill="#9ece6a">$</text>
      <text x="704" y="116" fill="#c0caf5">whoami</text>
      <rect id="c1" class="cover" x="702" y="98" width="66" height="26" fill="#16161e"/>

      <text x="684" y="144" fill="#a9b1d6" class="fade o1">sadeq — full-stack dev, cs student</text>

      <text x="684" y="182" fill="#9ece6a">$</text>
      <text x="704" y="182" fill="#c0caf5">cat stack.txt</text>
      <rect id="c2" class="cover" x="702" y="164" width="143" height="26" fill="#16161e"/>

      <text x="684" y="210" class="fade o2"><tspan fill="#7aa2f7">C#</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#bb9af7">.NET</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#7dcfff">React</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#7aa2f7">TS</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#f7768e">C++</tspan><tspan fill="#565f89"> · </tspan><tspan fill="#e0af68">SQL</tspan></text>

      <text x="684" y="248" fill="#9ece6a" class="fade o2">$</text>
      <rect x="704" y="232" width="10" height="20" fill="#c0caf5" class="cursor"/>
    </g>
  </g>
  <rect x="660.5" y="44.5" width="479" height="231" rx="12" fill="none" stroke="#292e42"/>
</svg>
